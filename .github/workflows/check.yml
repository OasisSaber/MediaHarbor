name: Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Ubuntu 纯 Python 验证。job 名称 check-ubuntu 由仓库 ruleset
  # main-protection 的 required status check 固定，不得改名或删除。
  # Untitled 正式支持 Windows x64；Ubuntu 仅证明纯 Python 测试可运行。
  check-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: python -m pip install pytest ruff

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint check
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -v

      - name: Smoke test locate_root
        run: python skill/untitled/scripts/locate_root.py --json

      - name: Smoke test check_tools
        run: python skill/untitled/scripts/check_tools.py --json

  # 中央 TheMasterplan 可重用工作流：验证消费者契约（根部 AGENTS.md 存在、
  # project-check-path 非空且受 Git 跟踪）、PR 正文契约，并运行项目 CI 验证
  # 入口 scripts/ci-check.sh（安装 pytest/ruff 后调用权威入口 scripts/validate.sh）。
  # 真实 check-run 名称：aw-check。该 Ubuntu job 仅证明纯 Python 测试可运行；
  # Untitled 正式支持 Windows x64，不是 Linux 平台支持声明。
  aw-check:
    uses: OasisSaber/TheMasterplan/.github/workflows/aw-check.yml@v1
    with:
      # CI 专用入口：先安装 pytest/ruff（中央接口不安装调用方依赖），
      # 再调用权威验证入口 scripts/validate.sh。
      project-check-path: scripts/ci-check.sh

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: python -m pip install pytest ruff

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint check
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -v

      - name: Smoke test locate_root
        run: python skill/untitled/scripts/locate_root.py --json

      - name: Smoke test check_tools
        run: python skill/untitled/scripts/check_tools.py --json

      - name: PowerShell validation
        run: powershell -ExecutionPolicy Bypass -File scripts/validate.ps1

  manifest-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Validates tools-manifest.json structure always; once the
      # tools-windows-x64-v1 release exists, also cross-checks the manifest
      # sha256 values against the published SHA256SUMS.txt asset.
      - name: Verify tools manifest
        run: python scripts/fetch_tools.py --verify-manifest

